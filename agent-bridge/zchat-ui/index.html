<!doctype html>
<html lang="es" data-theme="console">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Página local (127.0.0.1): scripts y estilos solo propios; fuentes de Google. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none';"
    />
    <meta name="color-scheme" content="dark light" />
    <title>Chat con el agente — Hermes</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
    <!-- Bloqueante a propósito: aplica el tema guardado antes del primer paint. -->
    <script src="/app.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <header class="top">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6z" />
              <path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z" />
            </svg>
          </span>
          <div class="brand-text">
            <h1 id="title">Chat con el agente</h1>
            <p id="subtitle">conectando con la sesión…</p>
          </div>
        </div>
        <div class="top-actions">
          <span id="conn" class="conn" title="Estado del canal en vivo (SSE)"><i></i><span>conectando</span></span>
          <button type="button" id="toggleSide" class="icon-btn" title="Mostrar / ocultar el panel de misión" aria-label="Panel de misión">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
          </button>
          <button type="button" id="quit" class="ghost small" title="Apaga el servidor local del chat">cerrar chat</button>
        </div>
      </header>

      <main class="layout">
        <section class="chat" id="chatCol">
          <div class="scroll" id="scroll">
            <div class="thread" id="thread"></div>
          </div>
          <button type="button" id="jump" class="jump hidden">↓ nuevos mensajes</button>
          <div class="status" id="status" aria-live="polite"></div>
          <footer class="composer">
            <div class="box">
              <textarea id="q" rows="1" placeholder="Preguntale al agente… (Enter envía · Shift+Enter salto de línea)" aria-label="Tu pregunta"></textarea>
              <div class="composer-actions">
                <span class="hint" id="hint">Responde con todo el contexto de su sesión · solo consulta, no ejecuta cambios</span>
                <div class="composer-buttons">
                  <button type="button" id="cancel" class="ghost small hidden" title="Detiene la respuesta en curso">Detener</button>
                  <button type="button" id="send" class="send" title="Enviar (Enter)" aria-label="Enviar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </footer>
        </section>

        <aside class="side" id="side" aria-label="Misión de la tarea">
          <div class="side-inner" id="sideInner">
            <div class="side-head"><h2>Misión</h2></div>
            <div class="card muted">Cargando el estado de la tarea…</div>
          </div>
        </aside>
      </main>
    </div>
    <div id="toast" class="toast hidden" role="status"></div>
  </body>
</html>
