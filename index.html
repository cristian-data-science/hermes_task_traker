<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Cris Agent Task — Panel personal de tareas en tiempo real"
    />
    <!--
      Content Security Policy (entregada vía <meta>).
       - script-src: self. El anti-flash del tema es un script EXTERNO
         (/theme-init.js), así que no necesita hash — hashear el inline viejo
         era frágil: el hash cambiaba con los finales de línea (CRLF local
         vs LF en Vercel) y el anti-flash estuvo bloqueado en silencio desde
         el hardening hasta que salió este error.
         El único hash extra es del snippet que vite-plugin-pwa inyecta
         inline SOLO en dev (register-dev-sw, incondicional con
         devOptions.enabled) — inerte en el build de producción. Si
         actualizás vite-plugin-pwa y vuelve el error de CSP, recalculalo
         con el contenido del script que la consola muestra bloqueado.
         Ojo: el meta CSP solo aplica a lo que viene DESPUÉS de él en el
         documento — por eso el preamble de react-refresh (que Vite inyecta
         antes) nunca fue bloqueado.
       - connect-src: self + Convex (WebSocket/HTTPS) para los datos.
       - style-src/font-src/img: self + Google Fonts (estáticos).
      NOTA: HSTS, X-Frame-Options y frame-ancestors NO se pueden forzar vía
      <meta> (el navegador los ignora); configúralos como cabeceras HTTP en el
      hosting (Vercel/Netlify/Convex Hosting).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-/AO8vAagk08SqUGxY96ci/dGyTDsuoetPOJYMn7sc+E='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.convex.cloud https://*.convex.site wss://*.convex.cloud wss://*.convex.site; base-uri 'self'; manifest-src 'self'; worker-src 'self';"
    />
    <meta name="referrer" content="no-referrer" />
    <!-- PWA (móvil/instalada): color de la barra de estado e icono iOS.
         No afecta el render de la app en desktop. -->
    <meta name="theme-color" content="#010603" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hermes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Cris Agent Task</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Anti-flash del tema: script externo (CSP-friendly, ver comentario
         del meta CSP arriba y de public/theme-init.js). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
