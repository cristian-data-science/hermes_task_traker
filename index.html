<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Cris Agent Task — Panel personal de tareas en tiempo real"
    />
    <!--
      Content Security Policy (entregada vía <meta>).
       - script-src: self + el hash del script inline del tema (anti-flash).
         Bloquea la ejecución de scripts inyectados por terceros (mitiga XSS).
       - connect-src: self + Convex (WebSocket/HTTPS) para los datos.
       - style-src/font-src/img: self + Google Fonts (estáticos).
      NOTA: HSTS, X-Frame-Options y frame-ancestors NO se pueden forzar vía
      <meta> (el navegador los ignora); configúralos como cabeceras HTTP en el
      hosting (Vercel/Netlify/Convex Hosting).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-E8/woXC1mYRzlXMBSV1OVriw9lWXXQpv5bgnuPq+LOo='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.convex.cloud https://*.convex.site wss://*.convex.cloud wss://*.convex.site; base-uri 'self';"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Cris Agent Task</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplicar el tema guardado antes del primer paint (evita flash)
      (function () {
        try {
          var t = localStorage.getItem("cat-theme");
          var valid = ["matrix", "terminal", "paper", "brutal"];
          document.documentElement.dataset.theme =
            valid.indexOf(t) >= 0 ? t : "matrix";
        } catch (e) {
          document.documentElement.dataset.theme = "matrix";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
